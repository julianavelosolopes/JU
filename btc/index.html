<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel BTC</title>
<style>
:root{--olive:#5C6B4F;--olive-dark:#46533C;--gold:#C9A96E;--cream:#F5F0E8;--ink:#2B3024;--card:#FBF8F2;--up:#2f7d4f;--down:#b04a3a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
header{background:var(--olive);color:var(--cream);padding:28px 0}
header h1{font-family:Georgia,serif;font-weight:normal;font-size:26px}
header small{color:var(--gold);letter-spacing:.2em;font-size:12px;text-transform:uppercase}
main{padding:24px 0 48px}
.grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid rgba(92,107,79,.22);border-radius:16px;padding:18px}
.card.big{grid-column:1/-1}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--olive)}
.val{font-family:Georgia,serif;font-size:26px;color:var(--olive-dark);margin-top:4px;font-variant-numeric:tabular-nums}
.big .val{font-size:clamp(34px,9vw,52px)}
.up{color:var(--up)}.down{color:var(--down)}
svg{width:100%;height:150px;margin-top:10px;display:block}
.bar{display:flex;gap:6px;margin:0 0 14px}
.bar button{flex:1;padding:9px;border:1px solid var(--olive);background:transparent;color:var(--olive-dark);border-radius:999px;font-size:14px;cursor:pointer}
.bar button.on{background:var(--olive);color:var(--cream)}
.calc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.calc input{padding:10px;border:1px solid rgba(92,107,79,.4);border-radius:10px;font-size:16px;width:140px;background:#fff}
footer{font-size:12px;opacity:.7;text-align:center;padding-bottom:30px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><small>Painel</small><h1>Bitcoin (BTC)</h1></div></header>
<main class="wrap">
  <div class="bar" id="range">
    <button data-d="1" class="on">24h</button><button data-d="7">7d</button><button data-d="30">30d</button><button data-d="365">1a</button>
  </div>
  <div class="grid">
    <div class="card big">
      <div class="label">Preço em BRL</div>
      <div class="val" id="brl">…</div>
      <div id="chg" class="label" style="margin-top:6px"></div>
      <svg id="chart" viewBox="0 0 600 150" preserveAspectRatio="none"></svg>
    </div>
    <div class="card"><div class="label">Preço em USD</div><div class="val" id="usd">…</div></div>
    <div class="card"><div class="label">Dólar (BRL/USD)</div><div class="val" id="fx">…</div></div>
    <div class="card"><div class="label">Máx / mín do período</div><div class="val" id="hl" style="font-size:19px">…</div></div>
    <div class="card"><div class="label">Valor de mercado</div><div class="val" id="mc" style="font-size:19px">…</div></div>
    <div class="card big">
      <div class="label">Calculadora</div>
      <div class="calc">
        <input id="inBrl" type="number" min="0" placeholder="R$" inputmode="decimal">
        <span>=</span><span class="val" id="outBtc" style="margin:0;font-size:20px">0 BTC</span>
      </div>
    </div>
  </div>
  <p id="status" class="label" style="margin-top:16px"></p>
</main>
<footer>Dados: CoinGecko. Informativo, não é recomendação de investimento.</footer>
<script>
const API="https://api.coingecko.com/api/v3";
const $=id=>document.getElementById(id);
const fmt=(n,c)=>n.toLocaleString("pt-BR",{style:"currency",currency:c,maximumFractionDigits:c==="BRL"||c==="USD"?0:2});
let price=0,days=1;
async function j(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
async function load(){
  try{
    const [s,c]=await Promise.all([
      j(`${API}/coins/markets?vs_currency=brl&ids=bitcoin&price_change_percentage=24h`),
      j(`${API}/coins/bitcoin/market_chart?vs_currency=brl&days=${days}`)
    ]);
    const u=await j(`${API}/simple/price?ids=bitcoin&vs_currencies=usd,brl`);
    const m=s[0];price=m.current_price;
    $("brl").textContent=fmt(price,"BRL");
    $("usd").textContent=fmt(u.bitcoin.usd,"USD");
    $("fx").textContent=(u.bitcoin.brl/u.bitcoin.usd).toFixed(2).replace(".",",");
    $("mc").textContent="R$ "+(m.market_cap/1e12).toFixed(2).replace(".",",")+" tri";
    const p=c.prices.map(x=>x[1]),first=p[0],last=p[p.length-1],pc=(last/first-1)*100;
    $("chg").innerHTML=`<span class="${pc>=0?"up":"down"}">${pc>=0?"▲":"▼"} ${pc.toFixed(2).replace(".",",")}%</span> no período`;
    $("hl").textContent=`${fmt(Math.max(...p),"BRL")} / ${fmt(Math.min(...p),"BRL")}`;
    draw(p,pc>=0);calc();
    $("status").textContent="Atualizado às "+new Date().toLocaleTimeString("pt-BR");
  }catch(e){$("status").textContent="Não foi possível carregar os dados agora. Tentando de novo em 1 min."}
}
function draw(p,up){
  const mn=Math.min(...p),mx=Math.max(...p),W=600,H=150;
  const pts=p.map((v,i)=>`${(i/(p.length-1)*W).toFixed(1)},${(H-6-(v-mn)/(mx-mn||1)*(H-12)).toFixed(1)}`).join(" ");
  const col=up?"#2f7d4f":"#b04a3a";
  $("chart").innerHTML=`<polyline fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts}"/>`;
}
function calc(){const v=parseFloat($("inBrl").value)||0;$("outBtc").textContent=(price?v/price:0).toFixed(8).replace(".",",")+" BTC"}
$("inBrl").addEventListener("input",calc);
$("range").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#range button").forEach(x=>x.classList.toggle("on",x===b));days=b.dataset.d;load()});
load();setInterval(load,60000);
</script>
</body>
</html>
